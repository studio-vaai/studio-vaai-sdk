name: Set up Binaryen
description: Install the WASM optimizer used by the SDK build
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP"
        archive=binaryen-version_133-x86_64-linux.tar.gz
        curl --fail --silent --show-error --location --retry 3 \
          "https://github.com/WebAssembly/binaryen/releases/download/version_133/$archive" \
          --output "$archive"
        printf '%s  %s\n' 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489 "$archive" |
          sha256sum -c -
        tar -xzf "$archive" binaryen-version_133/bin/wasm-opt
        echo "$RUNNER_TEMP/binaryen-version_133/bin" >> "$GITHUB_PATH"
