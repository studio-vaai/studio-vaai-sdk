name: studio_vaai
description: >-
  studio vaai virtual try-on for Flutter and Dart: the shared Rust SDK core
  (state machine and API client) through UniFFI-generated Dart bindings.
# Released by the SDK repository's Flutter workflow on a `studio_vaai-v<version>`
# tag; see README.md, "Releases".
version: 0.1.0
homepage: https://studio-vaai.com
repository: https://github.com/studio-vaai/studio-vaai-sdk/tree/main/sdks/flutter
issue_tracker: https://github.com/studio-vaai/studio-vaai-sdk/issues
topics:
  - virtual-try-on
  - fashion
  - ecommerce
  - ffi

# The prebuilt core covers these; the build hook downloads it per target.
platforms:
  android:
  ios:
  macos:

# Dart 3.12 and Flutter 3.44: what the camera plugin requires (and the build
# hooks need Dart 3.10).
environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  camera: ^0.12.2
  code_assets: ^2.0.0
  crypto: ^3.0.0
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  hooks: ^2.0.0
  image: ^4.5.0
  image_picker: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0

# The photo guide's artwork, the same images as the web SDK's, and the web's
# font: Inter (a Latin subset of the official release, SIL OFL 1.1) in the
# weights the widgets use, as this package's family `Inter` (`TryOnTokens.fontFamily`).
flutter:
  assets:
    - assets/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600

# `flutter test` here builds the core in debug: faster to compile, same behavior.
# (Only this package's own tests: an app's pubspec sets its own user-defines.)
hooks:
  user_defines:
    studio_vaai:
      cargo_profile: debug
