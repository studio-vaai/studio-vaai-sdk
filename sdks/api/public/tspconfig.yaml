emit:
  - "@typespec/openapi3"

# project-root = this directory (`public`); the document lands in `../generated/`.
output-dir: "{project-root}/../generated"

options:
  "@typespec/openapi3":
    "emitter-output-dir": "{project-root}/../generated"
    "output-file": "openapi.yaml"
    "file-type": yaml
