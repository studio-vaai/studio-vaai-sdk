openapi: 3.0.0
info:
  title: studio vaai Analytics API
  version: '2026-11-20'
  summary: Collect cookieless storefront and try-on event counts.
tags:
  - name: analytics
paths:
  /v2/events:
    post:
      operationId: sendAnalyticsEvent
      summary: Send an analytics event
      description: |-
        Send storefront and try-on events with the same X-Client-Api-Key used by the business API.
        Omit shopper credentials, cookies and browser context. An event ID identifies one occurrence.

        See [Analytics](/analytics) for integration guidance and the event catalogue.
      parameters:
        - name: X-Client-Api-Key
          in: header
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AnalyticsEventProblem'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AnalyticsEventProblem'
        '403':
          description: Access is forbidden.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AnalyticsEventProblem'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AnalyticsEventProblem'
        '413':
          description: Client error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AnalyticsEventProblem'
        '415':
          description: Client error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AnalyticsEventProblem'
        '502':
          description: Server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AnalyticsEventProblem'
        '503':
          description: Service unavailable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AnalyticsEventProblem'
      tags:
        - analytics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsEventRequest'
security:
  - {}
components:
  schemas:
    AnalyticsEvent:
      anyOf:
        - $ref: '#/components/schemas/EntrypointImpression'
        - $ref: '#/components/schemas/EntrypointClicked'
        - $ref: '#/components/schemas/WidgetOpened'
        - $ref: '#/components/schemas/IntroOpened'
        - $ref: '#/components/schemas/ConsentGranted'
        - $ref: '#/components/schemas/ImageRecordInitiated'
        - $ref: '#/components/schemas/ImageRecordAborted'
        - $ref: '#/components/schemas/ImageUploadInitiated'
        - $ref: '#/components/schemas/ImageUploadAborted'
        - $ref: '#/components/schemas/ImageUploaded'
        - $ref: '#/components/schemas/PhotoRejected'
        - $ref: '#/components/schemas/HeightEntered'
        - $ref: '#/components/schemas/HeightStepOpened'
        - $ref: '#/components/schemas/VariantSelectionInitiated'
        - $ref: '#/components/schemas/VariantChanged'
        - $ref: '#/components/schemas/TryOnInitiated'
        - $ref: '#/components/schemas/GatedSizeSelected'
        - $ref: '#/components/schemas/TryOnPresented'
        - $ref: '#/components/schemas/ViewClosed'
        - $ref: '#/components/schemas/ExperienceOperationFailed'
        - $ref: '#/components/schemas/ExperienceSummary'
        - $ref: '#/components/schemas/SizeCompared'
        - $ref: '#/components/schemas/CartRequested'
        - $ref: '#/components/schemas/CartItemAdded'
        - $ref: '#/components/schemas/OrderPlaced'
        - $ref: '#/components/schemas/ExperimentAssigned'
      description: An event occurrence, with only its declared data fields.
    AnalyticsEventProblem:
      type: object
      required:
        - title
        - kind
      properties:
        title:
          type: string
        kind:
          type: string
          enum:
            - invalid-event
            - invalid-client-key
            - origin-forbidden
            - event-id-conflict
            - event-too-large
            - unsupported-media-type
            - upstream-delivery-failed
            - collector-unavailable
    AnalyticsEventRequest:
      type: object
      required:
        - eventId
        - event
      properties:
        eventId:
          type: string
          format: uuid
          description: UUID v4 generated for this occurrence only. Reuse only when repeating the same request.
        event:
          $ref: '#/components/schemas/AnalyticsEvent'
    AnalyticsImageSource:
      type: string
      enum:
        - intro
        - variant-selection
        - image-rejection
        - height
    AnalyticsLabel:
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]*$
    AnalyticsProductData:
      type: object
      required:
        - product-id
      properties:
        product-id:
          allOf:
            - $ref: '#/components/schemas/CatalogKey'
          description: Catalog product associated with this event.
    AnalyticsStep:
      type: string
      enum:
        - entry
        - intro
        - image-record
        - image-upload
        - image-rejection
        - height
        - variant-selection
        - try-on
    AnalyticsVariantData:
      type: object
      required:
        - product-id
      properties:
        product-id:
          allOf:
            - $ref: '#/components/schemas/CatalogKey'
          description: Catalog product associated with this event.
        variant-id:
          allOf:
            - $ref: '#/components/schemas/CatalogKey'
          description: Canonical variant ID, where supplied by the SDK.
        variant-size:
          allOf:
            - $ref: '#/components/schemas/CatalogKey'
          description: Catalog size, colorway, waist or length supplied by an existing host callback.
        variant-colorway:
          $ref: '#/components/schemas/CatalogKey'
        variant-waist:
          $ref: '#/components/schemas/CatalogKey'
        variant-length:
          $ref: '#/components/schemas/CatalogKey'
    CappedCount:
      type: integer
      format: int32
      minimum: 0
      maximum: 32
    CartItemAdded:
      type: object
      required:
        - name
        - data
      properties:
        name:
          type: string
          enum:
            - cart-item-added
        data:
          $ref: '#/components/schemas/AnalyticsVariantData'
      description: The host reports a successful cart addition.
      x-event-group: Commerce
    CartRequested:
      type: object
      required:
        - name
        - data
      properties:
        name:
          type: string
          enum:
            - cart-requested
        data:
          $ref: '#/components/schemas/AnalyticsVariantData'
      description: The widget hands a cart request to the host.
      x-event-group: Commerce
    CatalogKey:
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]*$
    ConsentGranted:
      type: object
      required:
        - name
        - data
      properties:
        name:
          type: string
          enum:
            - consent-granted
        data:
          $ref: '#/components/schemas/AnalyticsProductData'
      description: The widget acknowledges the photo and body processing consent action.
      x-event-group: Setup
    EntrypointClicked:
      type: object
      required:
        - name
        - data
      properties:
        name:
          type: string
          enum:
            - entrypoint-clicked
        data:
          type: object
          properties:
            product-id:
              allOf:
                - $ref: '#/components/schemas/CatalogKey'
              description: Catalog product associated with this event.
            entry:
              $ref: '#/components/schemas/AnalyticsLabel'
          required:
            - product-id
            - entry
      description: A try-on entry point activates.
      x-event-group: Storefront
    EntrypointImpression:
      type: object
      required:
        - name
        - data
      properties:
        name:
          type: string
          enum:
            - entrypoint-impression
        data:
          type: object
          properties:
            product-id:
              allOf:
                - $ref: '#/components/schemas/CatalogKey'
              description: Catalog product associated with this event.
            entry:
              $ref: '#/components/schemas/AnalyticsLabel'
          required:
            - product-id
            - entry
      description: A try-on entry point becomes visible.
      x-event-group: Storefront
    ExperienceOperationFailed:
      type: object
      required:
        - name
        - data
      properties:
        name:
          type: string
          enum:
            - experience-operation-failed
        data:
          type: object
          properties:
            product-id:
              allOf:
                - $ref: '#/components/schemas/CatalogKey'
              description: Catalog product associated with this event.
            work:
              type: string
              enum:
                - session
                - height
                - camera
                - capture
                - picker
                - photo
                - try-on
            outcome:
              type: string
              enum:
                - failed
                - uncertain
                - detached
                - in_progress
            reason:
              type: string
              enum:
                - deadline
                - slow
            current-step:
              $ref: '#/components/schemas/AnalyticsStep'
          required:
            - product-id
            - work
            - outcome
            - current-step
      description: An operation fails, detaches or has an unknown outcome. Slow and deadline signals can be counted independently.
      x-event-group: Try-on
    ExperienceSummary:
      type: object
      required:
        - name
        - data
      properties:
        name:
          type: string
          enum:
            - experience-summary
        data:
          type: object
          properties:
            product-id:
              allOf:
                - $ref: '#/components/schemas/CatalogKey'
              description: Catalog product associated with this event.
            entry:
              $ref: '#/components/schemas/AnalyticsLabel'
            reached-intro:
              type: boolean
            granted-consent:
              type: boolean
            accepted-photo:
              type: boolean
            confirmed-height:
              type: boolean
            reached-selection:
              type: boolean
            requested-try-on:
              type: boolean
            presented-result:
              type: boolean
            requested-cart:
              type: boolean
            try-on-count:
              $ref: '#/components/schemas/CappedCount'
            distinct-sizes:
              $ref: '#/components/schemas/CappedCount'
            distinct-colors:
              $ref: '#/components/schemas/CappedCount'
            distinct-waists:
              $ref: '#/components/schemas/CappedCount'
            distinct-lengths:
              $ref: '#/components/schemas/CappedCount'
            time-to-result:
              type: string
              enum:
                - lt-10s
                - 10-29s
                - 30-59s
                - 60-119s
                - 120s-plus
          required:
            - product-id
            - reached-intro
            - granted-consent
            - accepted-photo
            - confirmed-height
            - reached-selection
            - requested-try-on
            - presented-result
            - requested-cart
            - try-on-count
      description: A bounded summary for one observed open and product.
      x-event-group: Try-on
    ExperimentAssigned:
      type: object
      required:
        - name
        - data
      properties:
        name:
          type: string
          enum:
            - experiment-assigned
        data:
          type: object
          properties:
            experiment:
              type: string
              enum:
                - try-on-enabled
            variant:
              type: string
              enum:
                - enabled
                - disabled
          required:
            - experiment
            - variant
      description: An eligible rollout decision is observed.
      x-event-group: Rollout
    GatedSizeSelected:
      type: object
      required:
        - name
        - data
      properties:
        name:
          type: string
          enum:
            - gated-size-selected
        data:
          $ref: '#/components/schemas/AnalyticsProductData'
      description: The shopper selects a fit-gated size.
      x-event-group: Try-on
    HeightEntered:
      type: object
      required:
        - name
        - data
      properties:
        name:
          type: string
          enum:
            - height-entered
        data:
          $ref: '#/components/schemas/AnalyticsProductData'
      description: The widget acknowledges a height confirmation.
      x-event-group: Setup
    HeightStepOpened:
      type: object
      required:
        - name
        - data
      properties:
        name:
          type: string
          enum:
            - height-step-opened
        data:
          type: object
          properties:
            product-id:
              allOf:
                - $ref: '#/components/schemas/CatalogKey'
              description: Catalog product associated with this event.
            source:
              $ref: '#/components/schemas/AnalyticsStep'
          required:
            - product-id
            - source
      description: The widget opens the height step.
      x-event-group: Setup
    ImageRecordAborted:
      type: object
      required:
        - name
        - data
      properties:
        name:
          type: string
          enum:
            - image-record-aborted
        data:
          type: object
          properties:
            product-id:
              allOf:
                - $ref: '#/components/schemas/CatalogKey'
              description: Catalog product associated with this event.
            source:
              $ref: '#/components/schemas/AnalyticsImageSource'
          required:
            - product-id
            - source
      description: The shopper cancels the camera flow.
      x-event-group: Setup
    ImageRecordInitiated:
      type: object
      required:
        - name
        - data
      properties:
        name:
          type: string
          enum:
            - image-record-initiated
        data:
          type: object
          properties:
            product-id:
              allOf:
                - $ref: '#/components/schemas/CatalogKey'
              description: Catalog product associated with this event.
            source:
              $ref: '#/components/schemas/AnalyticsImageSource'
          required:
            - product-id
            - source
      description: The shopper launches the camera flow.
      x-event-group: Setup
    ImageUploadAborted:
      type: object
      required:
        - name
        - data
      properties:
        name:
          type: string
          enum:
            - image-upload-aborted
        data:
          type: object
          properties:
            product-id:
              allOf:
                - $ref: '#/components/schemas/CatalogKey'
              description: Catalog product associated with this event.
            source:
              $ref: '#/components/schemas/AnalyticsImageSource'
          required:
            - product-id
            - source
      description: The shopper cancels the photo picker.
      x-event-group: Setup
    ImageUploadInitiated:
      type: object
      required:
        - name
        - data
      properties:
        name:
          type: string
          enum:
            - image-upload-initiated
        data:
          type: object
          properties:
            product-id:
              allOf:
                - $ref: '#/components/schemas/CatalogKey'
              description: Catalog product associated with this event.
            source:
              $ref: '#/components/schemas/AnalyticsImageSource'
          required:
            - product-id
            - source
      description: The shopper launches the photo picker.
      x-event-group: Setup
    ImageUploaded:
      type: object
      required:
        - name
        - data
      properties:
        name:
          type: string
          enum:
            - image-uploaded
        data:
          type: object
          properties:
            product-id:
              allOf:
                - $ref: '#/components/schemas/CatalogKey'
              description: Catalog product associated with this event.
            image-source:
              type: string
              enum:
                - record-self-timer
                - record-system-dialog
                - select
          required:
            - product-id
            - image-source
      description: Photo processing succeeds.
      x-event-group: Setup
    IntroOpened:
      type: object
      required:
        - name
        - data
      properties:
        name:
          type: string
          enum:
            - intro-opened
        data:
          type: object
          properties:
            product-id:
              allOf:
                - $ref: '#/components/schemas/CatalogKey'
              description: Catalog product associated with this event.
            source:
              $ref: '#/components/schemas/AnalyticsStep'
          required:
            - product-id
            - source
      description: The introduction opens.
      x-event-group: Setup
    OrderPlaced:
      type: object
      required:
        - name
        - data
      properties:
        name:
          type: string
          enum:
            - order-placed
        data:
          $ref: '#/components/schemas/AnalyticsVariantData'
      description: The host reports one purchased variant.
      x-event-group: Commerce
    PhotoRejected:
      type: object
      required:
        - name
        - data
      properties:
        name:
          type: string
          enum:
            - photo-rejected
        data:
          type: object
          properties:
            product-id:
              allOf:
                - $ref: '#/components/schemas/CatalogKey'
              description: Catalog product associated with this event.
            method:
              type: string
              enum:
                - camera
                - picker
          required:
            - product-id
            - method
      description: Photo processing rejects the photo.
      x-event-group: Setup
    SizeCompared:
      type: object
      required:
        - name
        - data
      properties:
        name:
          type: string
          enum:
            - size-compared
        data:
          type: object
          properties:
            product-id:
              allOf:
                - $ref: '#/components/schemas/CatalogKey'
              description: Catalog product associated with this event.
            measure:
              type: string
              enum:
                - tried
                - cart
            recommended-size:
              $ref: '#/components/schemas/CatalogKey'
            observed-size:
              $ref: '#/components/schemas/CatalogKey'
            recommended-length:
              $ref: '#/components/schemas/CatalogKey'
            observed-length:
              $ref: '#/components/schemas/CatalogKey'
          required:
            - product-id
            - measure
      description: One distinct recommended and presented size pair in an open product experience, or a confirmed cart addition. Axis values are shop catalog identifiers. Omitted axes remain unobserved.
      x-event-group: Try-on
    TryOnInitiated:
      type: object
      required:
        - name
        - data
      properties:
        name:
          type: string
          enum:
            - try-on-initiated
        data:
          type: object
          properties:
            product-id:
              allOf:
                - $ref: '#/components/schemas/CatalogKey'
              description: Catalog product associated with this event.
            variant-id:
              allOf:
                - $ref: '#/components/schemas/CatalogKey'
              description: Canonical variant ID, where supplied by the SDK.
            variant-size:
              allOf:
                - $ref: '#/components/schemas/CatalogKey'
              description: Catalog size, colorway, waist or length supplied by an existing host callback.
            variant-colorway:
              $ref: '#/components/schemas/CatalogKey'
            variant-waist:
              $ref: '#/components/schemas/CatalogKey'
            variant-length:
              $ref: '#/components/schemas/CatalogKey'
            origin:
              type: string
              enum:
                - shopper
                - automatic
          required:
            - product-id
      description: The widget requests a try-on.
      x-event-group: Try-on
    TryOnPresented:
      type: object
      required:
        - name
        - data
      properties:
        name:
          type: string
          enum:
            - try-on-presented
        data:
          $ref: '#/components/schemas/AnalyticsVariantData'
      description: A distinct try-on result is shown in the widget.
      x-event-group: Try-on
    VariantChanged:
      type: object
      required:
        - name
        - data
      properties:
        name:
          type: string
          enum:
            - variant-changed
        data:
          $ref: '#/components/schemas/AnalyticsVariantData'
      description: The selection changes to a different variant.
      x-event-group: Try-on
    VariantSelectionInitiated:
      type: object
      required:
        - name
        - data
      properties:
        name:
          type: string
          enum:
            - variant-selection-initiated
        data:
          type: object
          properties:
            product-id:
              allOf:
                - $ref: '#/components/schemas/CatalogKey'
              description: Catalog product associated with this event.
            source:
              $ref: '#/components/schemas/AnalyticsStep'
            via:
              type: string
              enum:
                - back
                - go-to-product-overview
          required:
            - product-id
            - source
      description: The variant selection screen opens.
      x-event-group: Try-on
    ViewClosed:
      type: object
      required:
        - name
        - data
      properties:
        name:
          type: string
          enum:
            - view-closed
        data:
          type: object
          properties:
            product-id:
              allOf:
                - $ref: '#/components/schemas/CatalogKey'
              description: Catalog product associated with this event.
            current-step:
              $ref: '#/components/schemas/AnalyticsStep'
            result-displayed:
              type: boolean
          required:
            - product-id
            - current-step
      description: An open widget closes.
      x-event-group: Try-on
    WidgetOpened:
      type: object
      required:
        - name
        - data
      properties:
        name:
          type: string
          enum:
            - widget-opened
        data:
          type: object
          properties:
            product-id:
              allOf:
                - $ref: '#/components/schemas/CatalogKey'
              description: Catalog product associated with this event.
            entry:
              $ref: '#/components/schemas/AnalyticsLabel'
          required:
            - product-id
      description: A widget opens or resumes.
      x-event-group: Storefront
servers:
  - url: https://a.studio-vaai.com
    description: Analytics
    variables: {}
