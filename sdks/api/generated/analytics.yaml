openapi: 3.0.0
info:
  title: studio vaai Analytics API
  version: '2026-11-04'
  summary: Collect storefront and try-on events.
tags:
  - name: analytics
paths:
  /api/send:
    post:
      operationId: sendAnalyticsEvent
      summary: Send an analytics event
      description: |-
        Send storefront and try-on events with the same X-Client-Api-Key used by the business API. The API key identifies the shop. Omit shopper credentials and cookies.

        See [Analytics](/api/analytics) for integration guidance and the event catalogue.
      parameters:
        - name: X-Client-Api-Key
          in: header
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        '400':
          description: The server could not understand the request due to invalid syntax.
        '401':
          description: Access is unauthorized.
        '403':
          description: Access is forbidden.
        '413':
          description: Client error
        '502':
          description: Server error
        '503':
          description: Service unavailable.
      tags:
        - analytics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsEventRequest'
security:
  - {}
components:
  schemas:
    AnalyticsContext:
      type: object
      properties:
        hostname:
          type: string
          maxLength: 100
          description: Storefront hostname, without a scheme or path.
          example: shop.example.com
        url:
          type: string
          description: Page path or URL. Prefer a path without sensitive query parameters.
          example: /products/longsleeve
        id:
          type: string
          description: Optional anonymous visitor identifier. Reuse the experiment assignment visitor ID to correlate rollout and conversion events. Never send a shopper session token or personal identifier.
        language:
          type: string
          maxLength: 35
          description: Browser language, for example en-GB.
        screen:
          type: string
          maxLength: 11
          description: Screen dimensions, for example 390x844.
        title:
          type: string
          description: Page title.
        referrer:
          type: string
          description: Referring page path or URL.
    AnalyticsEvent:
      anyOf:
        - $ref: '#/components/schemas/EntrypointImpression'
        - $ref: '#/components/schemas/EntrypointClicked'
        - $ref: '#/components/schemas/IntroOpened'
        - $ref: '#/components/schemas/ConsentGranted'
        - $ref: '#/components/schemas/ImageRecordInitiated'
        - $ref: '#/components/schemas/ImageRecordAborted'
        - $ref: '#/components/schemas/ImageUploadInitiated'
        - $ref: '#/components/schemas/ImageUploadAborted'
        - $ref: '#/components/schemas/ImageUploaded'
        - $ref: '#/components/schemas/HeightEntered'
        - $ref: '#/components/schemas/VariantSelectionInitiated'
        - $ref: '#/components/schemas/TryOnInitiated'
        - $ref: '#/components/schemas/GatedSizeSelected'
        - $ref: '#/components/schemas/CartItemAdded'
        - $ref: '#/components/schemas/OrderPlaced'
        - $ref: '#/components/schemas/ViewClosed'
        - $ref: '#/components/schemas/ExperimentAssigned'
        - $ref: '#/components/schemas/ExperienceOperationFailed'
      description: Named events supported by studio vaai integrations. Data values are flat string, number, or boolean properties; the event definitions specify the supported properties.
    AnalyticsEventRequest:
      type: object
      required:
        - type
        - payload
      properties:
        type:
          type: string
          enum:
            - event
        payload:
          $ref: '#/components/schemas/AnalyticsEvent'
      example:
        type: event
        payload:
          hostname: shop.example.com
          url: /products/longsleeve
          name: try-on-initiated
          data:
            product-id: longsleeve
            variant-size: M
    AnalyticsImageSource:
      type: string
      enum:
        - intro
        - variant-selection
        - image-rejection
        - height
      description: Where the user starts selecting or taking a photo.
    AnalyticsProductData:
      type: object
      required:
        - product-id
      properties:
        product-id:
          type: string
          description: Product associated with this event.
          example: longsleeve
        sdk-version:
          type: string
          description: SDK package and version, when using an SDK. Custom integrations may omit this property.
    AnalyticsStep:
      type: string
      enum:
        - entry
        - intro
        - image-record
        - image-upload
        - image-rejection
        - height
        - variant-selection
        - try-on
      description: A step in the user flow.
    AnalyticsVariantData:
      type: object
      required:
        - product-id
      properties:
        product-id:
          type: string
          description: Product associated with this event.
          example: longsleeve
        sdk-version:
          type: string
          description: SDK package and version, when using an SDK. Custom integrations may omit this property.
        variant-size:
          type: string
          description: Selected size, if the product has a size axis.
        variant-colorway:
          type: string
          description: Selected colorway, if the product has a colorway axis.
      allOf:
        - type: object
          additionalProperties:
            type: string
      description: Additional variant-<axis> string properties describe the selected variant, for example variant-colorway or variant-length.
    CartItemAdded:
      type: object
      required:
        - name
        - data
      properties:
        hostname:
