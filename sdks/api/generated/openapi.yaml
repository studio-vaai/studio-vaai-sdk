          type: string
          description: Pin the exact body revision to render. Omit to use the current revision.
        variantId:
          type: string
          description: "`id` of one of the product's `ProductDetails.variants`. An unknown id returns `variant-not-found`."
      description: The variant to try on.
    FinalizeBodyUploadBody:
      type: object
      required:
