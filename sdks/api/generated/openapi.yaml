openapi: 3.0.0
info:
  title: studio vaai Public API
  version: '2026-11-05'
  summary: Integrate virtual try-on into your storefront.
  description: Create shopper sessions, upload photos, retrieve size recommendations, and generate virtual try-ons. Business API requests use your shop's `X-Client-Api-Key`; OFREP evaluations use `X-API-Key`. Shopper-specific operations also require a Bearer session token or session cookie.
tags:
  - name: meta
  - name: session
  - name: body
  - name: catalog
  - name: experiments
  - name: try-on
paths:
  /bodies:
    post:
      operationId: createBody
      summary: Create a body
      description: Create a body from an uploaded image. This request waits for processing to finish. On success, use `body.bodyId` for height updates, size recommendations, and try-ons. The response also includes the height estimate and source image URL. Unsuitable images return `422` without creating a body. Missing, expired, or inaccessible uploads return `404`.
      parameters:
        - $ref: '#/components/parameters/ApiVersionHeader'
        - $ref: '#/components/parameters/ClientApiKeyHeader'
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BodyReady'
        '400':
          description: Some request fields are missing, invalid, or conflicting.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BodyBadRequestProblem'
        '401':
          description: The session credential is missing, malformed, invalid, expired, or used with the wrong transport.
          headers:
            WWW-Authenticate:
              required: true
              description: HTTP authentication challenge for the session credential accepted by this endpoint.
              schema:
                type: string
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/SessionUnauthorizedProblem'
        '403':
          description: The shop, Origin, or session scope does not permit this request.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/SessionForbiddenProblem'
        '404':
          description: The body or uploaded image was not found in this session.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BodyNotFoundProblem'
        '422':
          description: The image was rejected. Use `reason` to explain what needs to change.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/problem+json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/BodyValidationFailed'
                  - $ref: '#/components/schemas/BodyUnusableProblem'
        '500':
          description: An internal failure prevented the request from being completed.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorProblem'
      tags:
        - body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinalizeBodyUploadBody'
    get:
      operationId: listBodies
      summary: List bodies
      description: List the bodies in the current session. Includes bodies whose height has not been set; these omit `userProvidedHeightCm`. Each body includes a valid source image URL and its expiry, so this operation can also refresh expired URLs. Returns an empty `bodies` array when there are no bodies.
      parameters:
        - $ref: '#/components/parameters/ApiVersionHeader'
        - $ref: '#/components/parameters/ClientApiKeyHeader'
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBodiesResponse'
        '400':
          description: Some request fields are missing, invalid, or conflicting.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BodyBadRequestProblem'
        '401':
          description: The session credential is missing, malformed, invalid, expired, or used with the wrong transport.
          headers:
            WWW-Authenticate:
              required: true
              description: HTTP authentication challenge for the session credential accepted by this endpoint.
              schema:
                type: string
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/SessionUnauthorizedProblem'
        '403':
          description: The shop, Origin, or session scope does not permit this request.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/SessionForbiddenProblem'
        '500':
          description: An internal failure prevented the request from being completed.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorProblem'
      tags:
        - body
  /bodies/upload-urls:
    post:
      operationId: prepareBodyUpload
      summary: Prepare a body image upload
      description: Get a temporary URL for uploading an image. Upload the image bytes using the returned `method` and `requiredHeaders`, then pass `stagingKey` to `createBody`.
      parameters:
        - $ref: '#/components/parameters/ApiVersionHeader'
        - $ref: '#/components/parameters/ClientApiKeyHeader'
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrepareBodyUploadResponse'
        '400':
          description: Some request fields are missing, invalid, or conflicting.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BodyBadRequestProblem'
        '401':
          description: The session credential is missing, malformed, invalid, expired, or used with the wrong transport.
          headers:
            WWW-Authenticate:
              required: true
              description: HTTP authentication challenge for the session credential accepted by this endpoint.
              schema:
                type: string
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/SessionUnauthorizedProblem'
        '403':
          description: The shop, Origin, or session scope does not permit this request.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/SessionForbiddenProblem'
        '500':
          description: An internal failure prevented the request from being completed.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorProblem'
      tags:
        - body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrepareBodyUploadBody'
  /bodies/{bodyId}/height:
    patch:
      operationId: setBodyHeight
      summary: Set Body Height
      description: Set the body's height in centimetres. A successful update returns `204` with no response body by default. With `returnRevision` it returns `200` with the exact revision written. Invalid input returns `400`. If the body cannot be adjusted to the requested height, the API returns `422` and keeps the previous values. Missing or inaccessible bodies return `404`.
      parameters:
        - $ref: '#/components/parameters/ApiVersionHeader'
        - $ref: '#/components/parameters/ClientApiKeyHeader'
        - name: bodyId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BodyHeightRevision'
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
        '400':
          description: Some request fields are missing, invalid, or conflicting.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BodyBadRequestProblem'
        '401':
          description: The session credential is missing, malformed, invalid, expired, or used with the wrong transport.
          headers:
            WWW-Authenticate:
              required: true
              description: HTTP authentication challenge for the session credential accepted by this endpoint.
              schema:
                type: string
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/SessionUnauthorizedProblem'
        '403':
          description: The shop, Origin, or session scope does not permit this request.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/SessionForbiddenProblem'
        '404':
          description: The body or uploaded image was not found in this session.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BodyNotFoundProblem'
        '422':
          description: The body could not be adjusted to the requested height.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BodyHeightUnusableProblem'
        '500':
          description: An internal failure prevented the request from being completed.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorProblem'
      tags:
        - body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetBodyHeightBody'
  /health:
    get:
      operationId: getHealth
      summary: Check API availability
      description: Check whether the public API is available to accept requests. Returns 200 when available or 503 when unavailable. No API key or session is required. Responses must not be cached.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: The service is temporarily unavailable.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableProblem'
      tags:
        - meta
      security:
        - {}
  /ofrep/v1/evaluate/flags:
    post:
      operationId: evaluateFlagsBulk
      summary: Evaluate all flags
      description: Evaluate all flags available to the shop for the supplied context. The 200 response includes off values and individual flag errors; a failure affecting one flag does not discard other results. Use ETag and If-None-Match for polling. After validating the API key and request context, return 304 with no body only when the evaluated result is unchanged for this shop and context.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: ETag from a previous bulk response. An unchanged evaluated result returns 304; otherwise a complete 200 response replaces the previous flag set.
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - private, no-cache
            ETag:
              required: true
              description: Opaque quoted validator for the evaluated result, scoped to the shop and supplied context. Send it in If-None-Match on the next bulk request. A changed context or result must not reuse a validator that would preserve a stale decision.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfrepBulkEvaluationSuccess'
        '304':
          description: The client has made a conditional request and the resource has not been modified.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - private, no-cache
            ETag:
              required: true
              description: Opaque quoted validator for the evaluated result, scoped to the shop and supplied context. Send it in If-None-Match on the next bulk request. A changed context or result must not reuse a validator that would preserve a stale decision.
              schema:
                type: string
        '400':
          description: The bulk request or its context is invalid.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfrepBulkEvaluationFailure'
        '401':
          description: The shop API key is missing or invalid.
          headers:
            WWW-Authenticate:
              required: true
              description: Authentication challenge for this service's API-key authentication.
              schema:
                type: string
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
        '403':
          description: Access to the shop's flags is not allowed for this request.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
        '429':
          description: The request was rate-limited. Wait until Retry-After before sending another evaluation request.
          headers:
            Retry-After:
              required: true
              description: When to retry, expressed as an HTTP date or a delay in seconds.
              schema:
                type: string
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
        '500':
          description: The service could not complete the evaluation.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfrepError'
      tags:
        - experiments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfrepEvaluationRequest'
      security:
        - OfrepApiKeyAuth: []
  /ofrep/v1/evaluate/flags/{key}:
    post:
      operationId: evaluateFlag
      summary: Evaluate a flag
      description: Evaluate a flag for the supplied context. Returns its value and reason on success, 400 for an evaluation failure, or 404 for an unknown key. Disabled flags return a successful value of false. Evaluation errors never masquerade as off decisions.
      parameters:
        - name: key
          in: path
          required: true
          description: Flag key to evaluate, such as try-on-enabled.
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfrepEvaluationSuccess'
        '400':
          description: The flag evaluation request is invalid or its context does not meet the flag's requirements.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfrepEvaluationFailure'
        '401':
          description: The shop API key is missing or invalid.
          headers:
            WWW-Authenticate:
              required: true
              description: Authentication challenge for this service's API-key authentication.
              schema:
                type: string
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
        '403':
          description: Access to the shop's flags is not allowed for this request.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
        '404':
          description: The requested flag key does not exist for this shop.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfrepFlagNotFound'
        '429':
          description: The request was rate-limited. Wait until Retry-After before sending another evaluation request.
          headers:
            Retry-After:
              required: true
              description: When to retry, expressed as an HTTP date or a delay in seconds.
              schema:
                type: string
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
        '500':
          description: The service could not complete the evaluation.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfrepError'
      tags:
        - experiments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfrepEvaluationRequest'
      security:
        - OfrepApiKeyAuth: []
  /products:
    get:
      operationId: listProducts
      summary: List products
      description: List the products of your shop that can be tried on. Requires the shop client API key; no shopper session is needed.
      parameters:
        - $ref: '#/components/parameters/ApiVersionHeader'
        - $ref: '#/components/parameters/ClientApiKeyHeader'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCatalog'
        '400':
          description: The request could not be completed. See `kind` and `detail` for the reason.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: The service could not complete the request. The request may be retried.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
        - catalog
      security:
        - {}
  /products/by-foreign-id/{foreignId}:
    get:
      operationId: getProductByForeignId
      summary: Find a product by your own id
      description: Retrieve a product by the id your storefront uses for it. A `product-not-found` error means the product cannot be tried on, so hide the try-on entry point. Requires the shop client API key; no shopper session is needed.
      parameters:
        - $ref: '#/components/parameters/ApiVersionHeader'
        - $ref: '#/components/parameters/ClientApiKeyHeader'
        - name: foreignId
          in: path
          required: true
          schema:
            type: string
        - name: include
          in: query
          required: false
          description: Optional diagnostic fields for internal tooling.
          schema:
            type: string
          x-internal: true
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetails'
        '400':
          description: The request could not be completed. See `kind` and `detail` for the reason.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Your shop has no such product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: The service could not complete the request. The request may be retried.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
        - catalog
      security:
        - {}
  /products/{productId}:
    get:
      operationId: getProductDetails
      summary: Get product details
      description: Retrieve a product's variants and fit details. Requires the shop client API key; no shopper session is needed. Products outside your shop return a `product-not-found` error.
      parameters:
        - $ref: '#/components/parameters/ApiVersionHeader'
        - $ref: '#/components/parameters/ClientApiKeyHeader'
        - name: productId
          in: path
          required: true
          schema:
            type: string
        - name: include
          in: query
          required: false
          description: Optional diagnostic fields for internal tooling.
          schema:
            type: string
          x-internal: true
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetails'
        '400':
          description: The request could not be completed. See `kind` and `detail` for the reason.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Your shop has no such product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: The service could not complete the request. The request may be retried.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
        - catalog
      security:
        - {}
  /products/{productId}/recommended-size:
    get:
      operationId: getRecommendedSize
      summary: Get size recommendations
      description: Get ranked size recommendations for a product and a body whose height has been set. If no size is eligible for try-on, `recommendedForeignIds` is absent; the ranked breakdown remains available.
      parameters:
        - $ref: '#/components/parameters/ApiVersionHeader'
        - $ref: '#/components/parameters/ClientApiKeyHeader'
        - name: productId
          in: path
          required: true
          schema:
            type: string
        - name: bodyId
          in: query
          required: true
          description: Body to use for the recommendation. Must belong to the current session.
          schema:
            type: string
          explode: false
        - name: bodyRevisionId
          in: query
          required: false
          description: Pin the exact body revision to score. Omit to use the current revision.
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendedSize'
        '400':
          description: Some request fields are missing, invalid, or conflicting.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/problem+json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/TryOnBadRequestProblem'
                  - $ref: '#/components/schemas/SizeRecommendationUnavailableProblem'
        '401':
          description: The session credential is missing, malformed, invalid, expired, or used with the wrong transport.
          headers:
            WWW-Authenticate:
              required: true
              description: HTTP authentication challenge for the session credential accepted by this endpoint.
              schema:
                type: string
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/SessionUnauthorizedProblem'
        '403':
          description: The shop, Origin, or session scope does not permit this request.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/SessionForbiddenProblem'
        '404':
          description: The requested body, product, variant, or try-on was not found.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TryOnNotFoundProblem'
        '500':
          description: An internal failure prevented the request from being completed.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorProblem'
      tags:
        - try-on
  /products/{productId}/try-on:
    post:
      operationId: createTryOn
      summary: Generate a try-on
      description: Generate a try-on for a body and a published product variant. This request waits for completion. Success returns 201 with the image. A size rejection returns a 422 problem response with a reason and a suggested alternative size. Use `getProductDetails` to discover the product's variants.
      parameters:
