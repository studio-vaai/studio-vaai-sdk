        originalHeight:
          type: integer
          format: int32
          minimum: 1
          description: Height of the original image in pixels, before resizing.
        uploadedWidth:
          type: integer
          format: int32
          minimum: 1
          maximum: 16384
          description: Width of the uploaded image in pixels. Supply together with `uploadedHeight` when resizing the image; otherwise omit both.
        uploadedHeight:
          type: integer
          format: int32
          minimum: 1
          maximum: 16384
          description: Height of the uploaded image in pixels. Supply together with `uploadedWidth` when resizing the image; otherwise omit both.
        focalLengthMm:
          type: number
          format: float
          description: Camera focal length in millimetres (`EXIF FocalLength`).
        focalLength35mm:
          type: number
          format: float
          description: 35 mm equivalent focal length in millimetres (`EXIF FocalLengthIn35mmFilm`).
        focalPlaneXResolution:
          type: number
          format: float
          description: Horizontal focal-plane resolution (`EXIF FocalPlaneXResolution`), in pixels per `focalPlaneResolutionUnit`.
        focalPlaneYResolution:
          type: number
          format: float
          description: Vertical focal-plane resolution (`EXIF FocalPlaneYResolution`), in pixels per `focalPlaneResolutionUnit`.
        focalPlaneResolutionUnit:
          type: integer
          format: int32
          description: 'Unit for the focal-plane resolutions: `2` for inches or `3` for centimetres (`EXIF FocalPlaneResolutionUnit`).'
      description: |-
        Image dimensions and optional EXIF values. When resizing an image before upload,
        send its original dimensions and any EXIF values that would be lost. If this
        object is omitted, the API reads metadata embedded in the uploaded image.
    InitialBodySummary:
