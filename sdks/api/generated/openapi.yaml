components:
  parameters:
    ApiVersionHeader:
      name: X-Api-Version
      in: header
      required: false
      description: Optional API compatibility version. The SDK sends `2026-11-05`.
      schema:
        type: string
    ClientApiKeyHeader:
      name: X-Client-Api-Key
      in: header
      required: true
      description: Your shop's public client API key, received during onboarding. Not a secret; safe for browser code. Required on business API requests except the health check. OFREP evaluations use X-API-Key instead.
      schema:
        type: string
  schemas:
    BearerSessionCreated:
      type: object
      required:
        - token
        - expiresAt
      properties:
        token:
          type: string
          description: 'Send as `Authorization: Bearer <session_token>` on shopper-specific requests, with credentials omitted.'
          example: SESSION_TOKEN
        expiresAt:
          type: string
          format: date-time
          description: Session expiry time in RFC 3339 format (UTC).
          example: '2026-10-01T12:00:00Z'
      description: Created bearer session and its credential.
    BearerSessionRefreshed:
      type: object
      required:
        - token
        - expiresAt
      properties:
        token:
          type: string
          description: Replacement session token; stop using the previous token after a successful refresh.
        expiresAt:
          type: string
          format: date-time
          description: Session expiry time in RFC 3339 format (UTC).
      description: Refreshed bearer session and its replacement credential.
    BodyBadRequestProblem:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - invalid-request
            - client-api-key-required
            - client-api-key-header-invalid
            - client-api-key-malformed
            - origin-header-invalid
            - origin-not-a-url
            - cookie-origin-required
            - ambiguous-session
            - invalid-content-type
            - invalid-byte-size
            - invalid-body-id
            - invalid-height
            - invalid-staging-key
            - invalid-image-metadata
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
      description: Some request fields are missing, invalid, or conflicting.
    BodyHeightRevision:
      type: object
      required:
        - bodyRevisionId
      properties:
        bodyRevisionId:
          type: string
          description: Identifier of the immutable body revision written by this request.
    BodyHeightUnusableProblem:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - height-calibration-failed
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
      description: The body could not be adjusted to this height. No changes were saved.
    BodyNotFoundProblem:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - body-not-found
            - upload-not-found
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
      description: The body or uploaded image is not available in this session. This also applies to bodies and uploads from another session.
    BodyReady:
      type: object
      required:
        - status
        - body
      properties:
        status:
          type: string
          enum:
            - ready
          description: Body creation has completed.
        body:
          allOf:
            - $ref: '#/components/schemas/InitialBodySummary'
          description: The created body.
      description: The body was created successfully. Use `setBodyHeight` to set its height.
    BodySummary:
      type: object
      properties:
        bodyRevisionId:
          type: string
          description: Identifier of the immutable revision represented by this summary. Pass it when requesting a try-on or size recommendation for this height.
        userProvidedHeightCm:
          type: number
          format: float
