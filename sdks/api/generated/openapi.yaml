        sourceImageUrlExpiresAt:
          type: string
          format: date-time
          description: When `sourceImageUrl` expires (UTC). Each `createBody` or `listBodies` response includes a valid URL and its expiry.
      description: A newly created body, with its initial height estimate and source image.
    InternalServerErrorProblem:
