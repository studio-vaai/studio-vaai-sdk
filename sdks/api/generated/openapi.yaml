          type: boolean
          enum:
            - true
          description: The shopper has explicitly consented to processing their photo and body measurements. Must be `true`.
        cookieChallenge:
          type: string
          description: Challenge returned by prepareCookieSession. Send unchanged within 60 seconds, using the same shop client key and registered Origin, with credentials included so the browser can return the preparation cookie. The challenge is not a session credential.
