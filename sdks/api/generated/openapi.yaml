          type: string
          enum:
            - session-token-required
            - session-token-malformed
            - session-invalid
            - session-expired
            - session-transport-mismatch
            - unsupported-auth-scheme
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
      description: An active session credential accepted by this endpoint is required. Expired or invalid sessions require a new session and consent.
    SessionView:
      type: object
      required:
        - expiresAt
      properties:
        expiresAt:
          type: string
          format: date-time
          description: Session expiry time in RFC 3339 format (UTC).
      description: Session metadata for the current Bearer or cookie session.
    SetBodyHeightBody:
      type: object
      required:
        - heightCm
      properties:
        heightCm:
          type: number
          format: float
          description: Height to set, in centimetres.
          example: 173
        productId:
          type: string
          description: Product for the next try-on. Providing it lets the server start speculative background computation to prepare the body for this product and make the next try-on faster. The height update does not wait for this computation. Omit when no product is selected.
        returnRevision:
          type: boolean
          description: Return the exact immutable revision written by this request as a 200 response.
      description: Height to apply to the body, with an optional product to prepare for the next try-on.
    SizeRecommendation:
      type: object
      required:
        - foreignIds
        - rank
        - rationale
        - fit
        - fitMatch
        - fitChecks
      properties:
        foreignIds:
          type: object
          additionalProperties:
            type: string
          description: 'This size on every axis it is sold by, in your shop''s own ids (for example `{ size: "M" }`, or `{ size: "32", style: "32" }` for waist × length). Colorway is not part of a size.'
        rank:
          type: integer
          format: int32
          description: 1-based rank; `1` is the best fit.
        rationale:
          type: string
          description: Human-readable rationale, e.g. `"Chest fits with +32 cm ease — oversized as intended"`.
        fit:
          type: string
          description: 'Fit category for this size: `too_small` | `runs_tight` | `ideal` | `runs_loose` | `too_loose`.'
        fitMatch:
          type: integer
          format: int32
          description: Fit-match score from 0 to 100. Higher values indicate a closer match to the product's intended fit.
        fitChecks:
          type: array
          items:
            $ref: '#/components/schemas/FitCheck'
          description: Fit assessments for the available circumference measurements, in size-chart order.
        gate:
          type: string
          enum:
            - too_small
            - too_large
          description: Present when a try-on in this size would be rejected as `too_small` or `too_large`. Use this to mark unavailable try-on sizes before submitting a request.
      description: One ranked size suggestion from the brand size chart, best first.
    SizeRecommendationUnavailableProblem:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - recommendation-unavailable
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
      description: A size recommendation could not be calculated for this product and body.
    TryOnBadRequestProblem:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - invalid-request
            - client-api-key-required
            - client-api-key-header-invalid
            - client-api-key-malformed
            - origin-header-invalid
            - origin-not-a-url
            - cookie-origin-required
            - ambiguous-session
            - invalid-body-id
            - invalid-product-id
            - invalid-try-on-id
            - invalid-variant-id
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
      description: Some request fields are missing, invalid, or conflicting.
    TryOnGarmentTooLarge:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          enum:
            - garment_too_large
          description: The garment is too large. Use this code to choose a localized message.
      allOf:
        - $ref: '#/components/schemas/TryOnSizeRejectionProblem'
      description: The selected size is too large for this body. Choose another size.
    TryOnGarmentTooSmall:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          enum:
            - garment_too_small
          description: The garment is too small. Use this code to choose a localized message.
      allOf:
        - $ref: '#/components/schemas/TryOnSizeRejectionProblem'
      description: The selected size is too small for this body. Choose another size.
    TryOnNotFoundProblem:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - body-not-found
            - product-not-found
            - variant-not-found
            - try-on-not-found
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
      description: The body, product, variant, or try-on is not available in the current session or shop. Resources outside that scope are also reported as not found.
    TryOnProvenance:
      type: object
      required:
        - bodyId
        - productId
        - pieceId
        - sizeSlug
        - createdAt
      properties:
        bodyId:
          type: string
          description: The body the garment was draped on.
        productId:
          type: string
        pieceId:
          type: string
          description: The catalog piece (one size of one style) that was rendered.
        sizeSlug:
          type: string
          description: Storefront size slug of that piece (`27-l30`, `s`).
        manifestHash:
          type: string
          description: blake3 (hex) of the publication manifest the piece pointed at when the try-on ran. Absent for pieces without a native publication.
        realizationId:
          type: string
          description: The publication's size (realization) id the piece selects, decimal.
        bakeHash:
          type: string
          description: blake3 (hex) of the stored drape (the publication's executable drape object) the render used.
        environment:
          type: string
          description: Deployment environment that served the try-on (`int`, `prod`, `dev`).
        apiBuild:
          type: string
          description: API server build (image tag, a commit) that ran the try-on.
        inferenceBuild:
          type: string
          description: Inference build (image tag, a commit) that rendered the image, when the renderer reported it.
        createdAt:
          type: string
          description: RFC 3339.
        resolvedAt:
          type: string
          description: RFC 3339.
      description: Where a try-on came from, so a reviewer can trace the image back to the exact bake and builds that produced it. Hashes and ids only, never who did anything. Not the C2PA manifest (that is in the image).
      x-internal: true
    TryOnScene:
      type: object
      required:
        - overlayColor
      properties:
        overlayColor:
          type: string
          description: Lowercase `#RRGGBB` hex.
      description: Presentation settings for the try-on image.
    TryOnSizeRejectionProblem:
      type: object
      required:
        - kind
        - tryOnId
      properties:
        kind:
          type: string
          enum:
            - try-on-size-rejected
        tryOnId:
          type: string
          description: Identifier of the rejected try-on.
        variantId:
          type: string
          description: The variant that was requested. Absent when that variant has since been retired.
        recommendedForeignIds:
          type: object
          additionalProperties:
            type: string
          description: "Alternative size to try, in your shop's own ids: one your shop sells. Colorway is not part of a size. Absent when your shop sells no size in that direction."
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
      description: The requested garment size was rejected for this body. Choose another size using the supplied reason and suggested alternative.
    TryOnSuccess:
      type: object
      required:
        - tryOnId
        - status
        - imageUrl
        - scene
      properties:
        bodyRevisionId:
          type: string
          description: The body revision rendered by this request, returned when creating a try-on.
        tryOnId:
          type: string
        status:
          type: string
          enum:
            - completed
        variantId:
          type: string
          description: The variant that was tried on. Absent when that variant has since been retired.
        imageUrl:
          type: string
        scene:
          $ref: '#/components/schemas/TryOnScene'
        fitAnchors:
          type: array
          items:
            $ref: '#/components/schemas/FitAnchor'
          description: Optional positions for fit annotations in the try-on image. Omitted when no annotations are available.
        provenance:
          allOf:
            - $ref: '#/components/schemas/TryOnProvenance'
          description: Diagnostic metadata for internal tooling.
          x-internal: true
    UploadHeader:
      type: object
      required:
        - name
        - value
      properties:
        name:
          type: string
          description: Header name.
        value:
          type: string
          description: Header value.
      description: An HTTP header required for the image upload.
  securitySchemes:
    BearerAuth:
      type: http
      scheme: Bearer
    SessionCookieAuth:
      type: apiKey
      in: cookie
      name: __Host-vaai_session_{shopId}
      description: The server chooses the shop-scoped cookie name from X-Client-Api-Key.
    OfrepApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Identifies the shop with its public client API key (`sv_client_…`) in X-API-Key. No shopper session is required.
servers:
  - url: https://api.studio-vaai.com
    description: Live
    variables: {}
