        templateId:
          type: string
        bindingId:
          type: string
          description: The catalog binding that sells the library garment as this template.
        garmentSlug:
          type: string
          description: Library garment slug.
        revisionNumber:
          type: integer
          format: int32
          description: Number of the promoted library revision (`5` reads `r5`). Absent before the template's first promotion.
        revisionId:
          type: string
        revisionMessage:
          type: string
          description: First line of the promoted revision's commit message, at most 120 characters.
        manifestHash:
          type: string
          description: "blake3 (hex) of the template's promoted publication manifest: what its sizes' `manifestHash` equal once the promotion reached every size."
        listingHash:
          type: string
          description: Content hash (hex) of the listing the promotion applied.
        promotedAt:
          type: string
