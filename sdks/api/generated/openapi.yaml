        - 'y'
      properties:
        dimension:
          type: string
          description: 'Body-dimension slug matching `FitCheck.dimension`: `chest` | `waist` | `sleeve_length` | `total_length`.'
        side:
          type: string
          description: Side of a paired annotation (`left` or `right`). Omitted for central annotations. Choose the better-positioned side when both are available.
        x:
          type: number
          format: double
          description: Normalized x in the output image (0 = left edge, 1 = right edge).
        'y':
          type: number
          format: double
          description: Normalized y in the output image (0 = top edge, 1 = bottom edge).
      description: Position of a fit annotation in the try-on image. Coordinates range from 0 to 1 relative to the complete image, with x increasing rightwards and y increasing downwards.
    FitCheck:
      type: object
      required:
        - pointId
        - label
        - dimension
        - garmentMm
        - bodyMm
        - easeMm
        - easeNorm
        - idealShiftNorm
        - intentSigmaNorm
        - fit
        - sentence
      properties:
        pointId:
          type: string
          description: Size-chart measurement identifier, such as `chest_width`.
        label:
          type: string
          description: The brand-authored column label (e.g. `"Chest Width"`).
        dimension:
          type: string
          description: 'Body measurement identifier for display and icon mapping: `chest` | `waist` | `hip` | `bottom` | `total_length` | `sleeve_length` | `shoulder_width` | `inseam` | `other`.'
        garmentMm:
          type: number
          format: double
          description: Garment circumference for this size, in millimetres.
        bodyMm:
          type: number
          format: double
          description: Matching shopper body circumference, in millimetres.
        easeMm:
          type: number
          format: double
          description: Garment circumference minus body circumference, in millimetres. Negative values indicate that the garment is smaller than the body.
        easeNorm:
          type: number
          format: double
          description: Distance from the intended fit, normalized by the fit tolerance. `0` is the intended fit; `-1` and `1` mark the boundaries of the intended range.
        idealShiftNorm:
          type: number
          format: double
          description: Offset of the intended-fit range on the fit scale, in the same units as `easeNorm`. Positive values indicate a looser or longer intended fit.
        intentSigmaNorm:
          type: number
          format: double
          description: Uncertainty of the intended-fit estimate, in the same units as `easeNorm`. Larger values indicate greater uncertainty.
        fit:
          type: string
          description: 'Fit category: `too_small` | `runs_tight` | `ideal` | `runs_loose` | `too_loose`.'
        sentence:
          type: string
          description: English explanation of this measurement. Use `fit` to provide your own localized text.
      description: Fit assessment for one size-chart measurement, including garment and shopper measurements and the resulting fit category.
    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - healthy
      description: The public API is available to accept requests.
    ImageMetadata:
