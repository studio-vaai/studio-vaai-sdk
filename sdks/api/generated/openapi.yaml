      summary: Create a cookie shopper session
      description: "Create a cookie session after obtaining the shopper's consent. First call prepareCookieSession, then send its challenge as cookieChallenge with credentials included, the same shop client key and registered Origin, and no Authorization header. The server validates the challenge and checks its preparation cookie before creating a shopper, session, or consent record. Missing, invalid, expired, or incorrectly scoped challenges, or a present but mismatched preparation cookie, return session-preparation-invalid. A valid challenge with no preparation cookie returns session-cookie-unavailable. Both errors leave the shopper, session, and consent record uncreated; this operation never creates a bearer session. Success sets a shop-scoped Secure, HttpOnly, SameSite=None, Partitioned session cookie without exposing the token in JSON. Use credentials: include on subsequent requests. Verify the actual session with getSession; a failed verification must not trigger automatic bearer fallback."
