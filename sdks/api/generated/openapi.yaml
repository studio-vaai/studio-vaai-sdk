        manifestHash:
          type: string
          description: blake3 (hex) of the promoted publication manifest.
        listingHash:
          type: string
          description: Content hash (hex) of the listing the promotion applied.
        promotedAt:
          type: string
          description: RFC 3339.
        environment:
          type: string
          description: Deployment environment that served the listing (`int`, `prod`, `dev`).
        apiBuild:
          type: string
          description: API server build (image tag, a commit) that served the listing.
        sizes:
          type: array
