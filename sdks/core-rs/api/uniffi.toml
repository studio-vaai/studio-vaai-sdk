# The bindings of the API client's own UniFFI namespace, which the `uniffi` feature exports and
# `studio-vaai-core` links into its library.

[bindings.swift]
module_name = "StudioVaaiApi"

[bindings.kotlin]
package_name = "com.studiovaai.core.api"
cdylib_name = "studio_vaai_core"

[bindings.dart]
# The Flutter package (sdks/flutter) bundles the library as its native asset
# `uniffi:studio_vaai_core`.
package_name = "studio_vaai"
cdylib_name = "studio_vaai_core"
