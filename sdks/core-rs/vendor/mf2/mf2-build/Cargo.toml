[package]
edition = "2024"
rust-version = "1.88"
name = "mf2-build"
version = "3.0.0"
authors = ["Evan Carroll"]
build = false
exclude = [
    "tests/common/",
    "tests/build.rs",
    "tests/drift.rs",
    "tests/loaders.rs",
    "tests/reference.rs",
    "tests/sizes.rs",
    "tests/slicing.rs",
    "package.txt",
]
publish = true
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "The MessageFormat 2 build pipeline: loaders, mf2.toml, the manifest, lints, per-locale catalogs and the generated Rust module."
homepage = "https://evancarroll.github.io/rust-mf2/"
documentation = "https://docs.rs/mf2-build"
readme = "README.md"
keywords = [
    "messageformat",
    "mf2",
    "i18n",
    "build",
    "codegen",
]
categories = [
    "internationalization",
    "localization",
    "development-tools::build-utils",
]
license = "MIT"
repository = "https://github.com/EvanCarroll/rust-mf2"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lib]
name = "mf2_build"
path = "src/lib.rs"

[[test]]
name = "config"
path = "tests/config.rs"

[dependencies.brotli]
version = "9.0.0"

[dependencies.flate2]
version = "1.1.10"

[dependencies.mf2-catalog]
path = "../mf2-catalog"
version = "=3.0.0"
features = [
    "content-hash",
    "decode",
    "manifest",
    "writer",
]

[dependencies.mf2-locale-data]
path = "../mf2-locale-data"
version = "=3.0.0"

[dependencies.mf2-model]
path = "../mf2-model"
version = "=3.0.0"
features = ["suite-names"]

[dependencies.mf2-resource]
path = "../mf2-resource"
version = "=3.0.0"

[dependencies.mf2-syntax]
path = "../mf2-syntax"
version = "=3.0.0"

[dependencies.serde]
version = "1.0.229"
features = [
    "derive",
    "alloc",
    "std",
]
default-features = false

[dependencies.serde_json]
version = "1.0.151"

[dependencies.thiserror]
version = "2.0.20"
features = ["std"]
default-features = false

[dependencies.toml]
version = "1.1.6"

[dependencies.unicode-ident]
version = "1.0.26"

[dependencies.unicode-normalization]
version = "0.1.25"
features = ["std"]
default-features = false

[dependencies.unicode-security]
version = "0.1.2"

[dev-dependencies.mf2-catalog]
path = "../mf2-catalog"
version = "=3.0.0"
features = ["server-data"]

[dev-dependencies.mf2-resource]
path = "../mf2-resource"
version = "=3.0.0"

[dev-dependencies.mf2-syntax]
path = "../mf2-syntax"
version = "=3.0.0"

[lints.clippy]
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
too_many_lines = "allow"

[lints.clippy.pedantic]
level = "warn"
priority = -1

[lints.rust]
missing_debug_implementations = "allow"
unreachable_pub = "warn"
unsafe_code = "deny"
# The ICU4X date backend is cut: code behind `feature = "icu-blob"` never
# compiles in, and the name is known so it draws no warning.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("icu-blob"))'] }
